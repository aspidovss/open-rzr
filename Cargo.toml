[workspace]
members = ["crates/rzr-protocol", "crates/rzr-hal", "crates/rzr-devices", "crates/rzr-core", "crates/rzr-cli", "app", "tools/openrazer-import"]
default-members = ["crates/rzr-protocol", "crates/rzr-hal", "crates/rzr-devices", "crates/rzr-core", "crates/rzr-cli", "app"]
resolver = "2"

[workspace.package]
version = "0.6.14"
edition = "2021"
license = "MIT"
authors = ["Sergei Aspidov"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
