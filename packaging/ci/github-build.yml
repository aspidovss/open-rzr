name: build

# Builds Windows and Linux packages and tests the window on every push; a tag like v0.2.0
# publishes a Release. (The same file is kept in packaging/ci/github-build.yml.)
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: open-rzr-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Clippy (unwrap/expect are denied outside tests)
        run: cargo clippy --workspace --all-targets
      - name: Build
        run: ./packaging/linux/build.sh --bundles
      - uses: actions/upload-artifact@v4
        with:
          name: open-rzr-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/uitest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: failure()
        run: node smoke.js --shots || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: tools/uitest/shots/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
