[package]
name = "rzr-core"
description = "open-rzr library: device access, device database, features, macros, profiles (no telemetry, no accounts)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# the library keeps its name: `use openrzr::…`
[lib]
name = "openrzr"
path = "src/lib.rs"

[features]
# `json` adds serde (backup/restore files, the Tauri app). Without it the crate is std-only.
default = ["json"]
json = ["dep:serde", "dep:serde_json", "rzr-hal/json"]

[dependencies]
rzr-hal = { path = "../rzr-hal", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
