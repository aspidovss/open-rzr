[package]
name = "open-rzr"
description = "open-rzr — Razer mouse configurator (Tauri app)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "open-rzr"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# block_in_place: USB requests off the async worker threads (same tokio as Tauri)
tokio = { version = "1", features = ["rt-multi-thread"] }
rzr-core = { path = "../crates/rzr-core", features = ["json"] }
